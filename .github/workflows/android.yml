# Gera o pacote do app para a Google Play (.aab assinado com a chave de upload) e publica sozinho.
# Roda a cada push na main que mexe no app, em Actions → "Android (Play Store)" → Run workflow, ou numa tag v1.0.0.
# Segredos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (obrigatórios).
#   ANDROID_KEY_ALIAS (padrão: upload) e ANDROID_KEY_PASSWORD (padrão: a mesma senha do keystore) são opcionais.
#   PLAY_SERVICE_ACCOUNT_JSON: chave da conta de serviço com acesso ao app no Play Console. Sem ela, só gera o .aab.
# Variáveis (opcionais): PLAY_TRACK (padrão: internal) e PLAY_STATUS (padrão: draft; mude para completed
#   depois que o app for aprovado, para a versão sair direto para os testadores).
name: Android (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão (ex.: 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["web/**", "android/**", "capacitor.config.*", "package.json", ".github/workflows/android.yml"]

concurrency:
  group: android-play
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # o runner ubuntu já vem com o Android SDK (ANDROID_HOME); o Gradle baixa o que faltar
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências e gerar o site
        run: |
          npm ci
          npx vite build
          npx cap sync android

      - name: Chave de upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Certificado intermediário do piugame
        run: bash scripts/piu-ca.sh

      - name: Gerar .aab
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v4
        with:
          name: piu-stats-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publicar na Google Play
        if: ${{ env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.henriquecarluci.stepclub
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          releaseName: ${{ format('1.0.{0}', github.run_number) }}
